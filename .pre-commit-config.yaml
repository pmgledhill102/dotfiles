repos:
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.21.0
    hooks:
      - id: markdownlint-cli2
        # fix: true # Uncomment to auto-fix

  # Layer 2 of ADR-0013 for ADR-0014: this repo is public, so private-repo
  # references must not be committed. Scans the whole tree rather than the
  # staged files, so it also catches a name that arrived some other way.
  - repo: local
    hooks:
      - id: check-no-private-repos
        name: No private repo references
        entry: scripts/check-no-private-repos.sh
        language: script
        pass_filenames: false
        always_run: true

  # Layer 2 of ADR-0013 for markdown link targets: markdownlint above checks
  # link syntax, never whether the target exists. Scans every tracked *.md
  # rather than the staged ones, so deleting a file also catches links to it
  # in documents this commit does not touch. See #402.
  - repo: local
    hooks:
      - id: check-markdown-links
        name: Markdown relative links resolve
        entry: scripts/check-markdown-links.sh
        language: script
        pass_filenames: false
        always_run: true

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      # The v8.30.1 manifest lacks pass_filenames: false, and `gitleaks git`
      # takes no file arguments, so pre-commit appended filenames fail every run.
      - id: gitleaks-system
        pass_filenames: false

  # No semgrep hook yet: `semgrep --config auto --error` blocks on install.sh,
  # whose bash.curl.security.curl-pipe-bash finding is the Homebrew installer
  # bootstrap by design. Add the hook once that is dealt with or declared.

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.14.1-1
    hooks:
      - id: shfmt
        # home/ holds the chezmoi source tree, whose scripts are deployed as-is;
        # leave them to their owners rather than reformatting them here.
        exclude: ^home/
