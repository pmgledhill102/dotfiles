# Dependabot configuration for automated dependency updates
# See: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
# Dependabot pull requests are authored by app/dependabot, so they match none of
# the GitHub mobile app's filters -- not "Created by me", not "Review
# requested". Assigning them puts them in "Assigned to me", a near-default view
# rather than a search string the app does not save.
#
# `reviewers` would have been the more natural key and no longer exists: GitHub
# removed it from the Dependabot options reference. `assignees` remains, and
# covers security updates as well as version updates.
#
# This does not gate auto-merge. Assignment is metadata, so patch and minor
# bumps still land themselves and disappear; what stays visible is whatever did
# NOT merge, which is the case worth seeing (paul-context#160).
  # GitHub Actions workflow dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    reviewers:
      - "pmgledhill102"
    open-pull-requests-limit: 5

  # Homebrew packages (macOS)
  # Note: Dependabot doesn't natively support Brewfile, but we can track
  # the Homebrew tap repository for updates manually

  # NPM packages (if using package.json in future)
  # - package-ecosystem: "npm"
  #   directory: "/"
  #   schedule:
  #     interval: "weekly"
  #   commit-message:
  #     prefix: "deps"
  #   labels:
  #     - "dependencies"
  #     - "javascript"

  # Python packages (if using requirements.txt or pyproject.toml in future)
  # - package-ecosystem: "pip"
  #   directory: "/"
  #   schedule:
  #     interval: "weekly"
  #   commit-message:
  #     prefix: "deps"
  #   labels:
  #     - "dependencies"
  #     - "python"
    assignees:
      - "pmgledhill102"
